name: Keep Supabase Alive

on:
  schedule:
    # Запуск каждый понедельник и четверг в 08:00 UTC (cron выражение)
    - cron: '0 8 * * 1,4'
  workflow_dispatch: # Позволяет запустить скрипт вручную из интерфейса GitHub

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database REST API
        run: |
          curl -s -o /dev/null -w "%{http_code}" -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
