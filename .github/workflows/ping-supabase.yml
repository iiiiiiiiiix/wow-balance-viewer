name: Ping Supabase

on:
  schedule:
    # Запуск 2 раза в неделю: понедельник и четверг в 08:00 UTC
    - cron: '0 8 * * 1,4'
  workflow_dispatch: # Позволяет запустить скрипт вручную из интерфейса GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase API via HEAD
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -s -o /dev/null -w "Status Code: %{http_code}\n" -I -X HEAD "$SUPABASE_URL/rest/v1/" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
