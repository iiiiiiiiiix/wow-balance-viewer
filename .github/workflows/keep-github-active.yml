name: Keep GitHub Active

on:
  schedule:
    # Запуск 1-го и 15-го числа каждого месяца в 00:00 UTC
    - cron: '0 0 1,15 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Activity Timestamp
        run: |
          date +"Last keep-alive: %Y-%m-%d %H:%M:%S UTC" > KEEP_ALIVE.md
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add KEEP_ALIVE.md
          git diff --quiet || git commit -m "chore: keep-alive activity update [skip ci]"
          git push
