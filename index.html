<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warmane Players Balance Stats</title>
    <style>
        :root {
            --color-gold: #ffb100;
            --panel-bg: rgba(12, 12, 12, 0.98);
            --border-gold: #3e3324;
            --bar-bg: #1a1a1a;
            --disabled-bg: #2a2a2a;
            --disabled-text: #666;
        }

        body {
            background: #050505;
            color: #f0ebe0;
            font-family: "Segoe UI", Tahoma, sans-serif;
            margin: 0; padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--panel-bg);
            border: 2px solid var(--border-gold);
            padding: 30px;
            box-shadow: 0 0 50px rgba(0,0,0,1);
        }

        h1 { text-align: center; color: var(--color-gold); margin-bottom: 30px;}

        /* Фильтры */
        .filter-form {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px; margin-bottom: 30px; padding-bottom: 25px; border-bottom: 1px solid var(--border-gold);
        }
        .filter-group { display: flex; flex-direction: column; gap: 5px; }
        .filter-group label { color: var(--color-gold); font-size: 11px; text-transform: uppercase; font-weight: bold; }

        select, .search-btn { background: #1a1a1a; color: #fff; border: 1px solid var(--border-gold); padding: 10px; font-size: 14px; }
        .search-btn {
            background: linear-gradient(to bottom, #4e3a23, #2a1d0d);
            color: var(--color-gold);
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            margin-top: 18px;
            border: 1px solid var(--color-gold);
            transition: all 0.2s;
        }
        .search-btn:hover:not(:disabled) { filter: brightness(1.3); box-shadow: 0 0 10px rgba(255, 177, 0, 0.3); }
        .search-btn:disabled {
            background: var(--disabled-bg);
            color: var(--disabled-text);
            border-color: #444;
            cursor: not-allowed;
            filter: none;
        }
        /* Анимация точек */
        .loading-text::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }
        @keyframes dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80% { content: '...'; }
        }

        /* Стили горизонтальных полосок */
        .stat-section { 
            margin-bottom: 50px; 
            width: 100%;
        }

        /* Контейнер для центрирования самих графиков */
        .stat-container {
            max-width: 500px; /* Ограничение для удобства чтения */
            margin: 0 auto;   /* Центрируем блок на экране */
        }

        .stat-section h2 { 
            color: var(--color-gold); 
            font-size: 1.1rem; 
            text-transform: uppercase; 
            border-left: 4px solid var(--color-gold); 
            padding-left: 12px; 
            margin-bottom: 20px;
            text-align: left; /* Заголовок выровнен по краю узкого контейнера */
        }
        
        .stat-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; width: 100%; }
        .icon-circle { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--color-gold); background: #000; flex-shrink: 0; object-fit: cover; }
        
        .progress-container { flex-grow: 1; background: var(--bar-bg); height: 26px; border: 1px solid #333; position: relative; overflow: hidden; border-radius: 2px; }
        .progress-bar { height: 100%; transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
        
        .label-text {
            position: absolute; width: 100%; height: 100%; top: 0; left: 0;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 10px; box-sizing: border-box; font-size: 13px; font-weight: bold;
            text-shadow: 1px 1px 1px #000; pointer-events: none;
            color: #fff;
        }

        .total-badge { text-align: center; font-size: 1.4rem; margin-bottom: 40px; }
        .total-badge span { color: var(--color-gold); font-weight: bold; }

        @media (max-width: 600px) {
            .container { padding: 15px; border: none; }
            .stat-container { max-width: 100%; } /* На мобилках используем всё место */
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Warmane Players Balance Stats</h1>

    <div class="filter-form">
        <div class="filter-group">
            <label>Realm</label>
            <select id="realmSelect"><option value="Onyxia">Onyxia</option></select>
        </div>
        <div class="filter-group">
            <label>Factions</label>
            <select id="factionSelect">
                <option value="">All Factions</option>
                <option value="Horde">Horde</option>
                <option value="Alliance">Alliance</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Races</label>
            <select id="raceSelect"><option value="">All Races</option></select>
        </div>
        <div class="filter-group">
            <label>Classes</label>
            <select id="classSelect"><option value="">All Classes</option></select>
        </div>
        <button class="search-btn" onclick="fetchStats()" id="fetchBtn">Get Stats</button>
    </div>

    <div id="resultsArea" style="display: none;">
        <div class="total-badge">Characters Found: <span id="countVal">0</span></div>
        
        <div class="stat-section">
            <div class="stat-container">
                <h2>Factions</h2>
                <div id="factionList"></div>
            </div>
        </div>

        <div class="stat-section">
            <div class="stat-container">
                <h2>Races</h2>
                <div id="raceList"></div>
            </div>
        </div>

        <div class="stat-section">
            <div class="stat-container">
                <h2>Classes</h2>
                <div id="classList"></div>
            </div>
        </div>
    </div>
</div>

<script>
    const API_URL = 'https://emikseoakgajjwflivva.supabase.co/functions/v1/get-stats';
    const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVtaWtzZW9ha2dhamp3ZmxpdnZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYzODMwOTcsImV4cCI6MjA4MTk1OTA5N30.497WMmn_pSOb-3KnQ9Vai7-wi2F6XLyUfx6bNsSd5WU';
    
    const statsCache = new Map();  // Объект для локального кэширования запросов

    const ICONS = {
        'Horde': 'assets/icons/faction_horde.jpg',
        'Alliance': 'assets/icons/faction_alliance.jpg',
        'Warrior': 'assets/icons/class_warrior.jpg',
        'Paladin': 'assets/icons/class_paladin.jpg',
        'Hunter': 'assets/icons/class_hunter.jpg',
        'Rogue': 'assets/icons/class_rogue.jpg',
        'Priest': 'assets/icons/class_priest.jpg',
        'Shaman': 'assets/icons/class_shaman.jpg',
        'Mage': 'assets/icons/class_mage.jpg',
        'Warlock': 'assets/icons/class_warlock.jpg',
        'Druid': 'assets/icons/class_druid.jpg',
        'Death Knight': 'assets/icons/class_deathknight.jpg',
        'Human': 'assets/icons/race_human_male.jpg',
        'Orc': 'assets/icons/race_orc_male.jpg',
        'Dwarf': 'assets/icons/race_dwarf_male.jpg',
        'Night Elf': 'assets/icons/race_nightelf_male.jpg',
        'Undead': 'assets/icons/race_undead_male.jpg',
        'Tauren': 'assets/icons/race_tauren_male.jpg',
        'Gnome': 'assets/icons/race_gnome_male.jpg',
        'Troll': 'assets/icons/race_troll_male.jpg',
        'Blood Elf': 'assets/icons/race_bloodelf_male.jpg',
        'Draenei': 'assets/icons/race_draenei_male.jpg'
    };

    const COLORS = {
        'Horde': '#8c1616', 'Alliance': '#004a94',
        'Warrior': '#C79C6E', 'Paladin': '#F58CBA', 'Hunter': '#ABD473', 'Rogue': '#FFF569',
        'Priest': '#FFFFFF', 'Shaman': '#0070DE', 'Mage': '#3FC7EB', 'Warlock': '#8787ED', 'Druid': '#FF7D0A'
    };

    const RACES = ["Blood Elf", "Draenei", "Dwarf", "Gnome", "Human", "Night Elf", "Orc", "Tauren", "Troll", "Undead"];
    const CLASSES = ["Druid", "Hunter", "Mage", "Paladin", "Priest", "Rogue", "Shaman", "Warlock", "Warrior"];
    
    // Инициализация фильтров
    const raceSel = document.getElementById('raceSelect');
    const classSel = document.getElementById('classSelect');
    RACES.forEach(r => raceSel.add(new Option(r, r)));
    CLASSES.forEach(c => classSel.add(new Option(c, c)));


    // 1. ПРИ ЗАГРУЗКЕ СТРАНИЦЫ: Читаем URL и запускаем поиск
    window.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        let hasParams = false;

        ['realm', 'faction', 'race', 'class'].forEach(key => {
            const val = urlParams.get(key);
            if (val) {
                const el = document.getElementById(key + 'Select');
                if (el) {
                    el.value = val;
                    hasParams = true;
                }
            }
        });

        if (hasParams) fetchStats(true); // true означает, что не нужно перезаписывать URL снова
    });

    async function fetchStats(skipPushState = false) {
        const btn = document.getElementById('fetchBtn');
        const realm = document.getElementById('realmSelect').value;
        const faction = document.getElementById('factionSelect').value;
        const race = document.getElementById('raceSelect').value;
        const classVal = document.getElementById('classSelect').value;

        // Создаем ключ для кэша и URL параметров
        const params = new URLSearchParams();
        if(realm) params.append('realm', realm);
        if(faction) params.append('faction', faction);
        if(race) params.append('race', race);
        if(classVal) params.append('class', classVal);
        
        const cacheKey = params.toString();

        // 2. ОБНОВЛЯЕМ URL (History API)
        if (!skipPushState) {
            const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?' + cacheKey;
            window.history.pushState({ path: newUrl }, '', newUrl);
        }

        // 3. ПРОВЕРЯЕМ КЭШ
        if (statsCache.has(cacheKey)) {
            console.log('Using cached data for:', cacheKey);
            displayResults(statsCache.get(cacheKey));
            return;
        }

        btn.disabled = true;
        btn.innerText = "LOADING...";
        
        try {
            const res = await fetch(`${API_URL}?${cacheKey}`, {
                headers: { 'apikey': ANON_KEY, 'Authorization': `Bearer ${ANON_KEY}` }
            });
            const data = await res.json();

            if (!data || data.total === 0) {
                alert("No characters found!");
                return;
            }

            // СОХРАНЯЕМ В КЭШ
            statsCache.set(cacheKey, data);
            displayResults(data);

        } catch (e) {
            console.error(e);
            alert("Connection error");
        } finally {
            btn.disabled = false;
            btn.innerText = "Get Stats";
        }
    }

    function displayResults(data) {
        document.getElementById('resultsArea').style.display = 'block';
        document.getElementById('countVal').innerText = data.total.toLocaleString();

        renderBars('factionList', data.factions);
        renderBars('raceList', data.races);
        renderBars('classList', data.classes);
    }

    function renderBars(containerId, items) {
        const container = document.getElementById(containerId);
        container.innerHTML = '';
        if(!items || items.length === 0) return;

        // 1. Считаем общую сумму для отображения реальных процентов
        const totalSum = items.reduce((a, b) => a + b.count, 0);
        
        // 2. Находим максимальное количество в текущей группе для визуальной шкалы
        const maxCount = Math.max(...items.map(item => item.count));
        
        // 3. Сортируем по убыванию
        const sorted = [...items].sort((a, b) => b.count - a.count);

        sorted.forEach(item => {
            // Реальный процент от общего числа (для текста)
            const realPerc = ((item.count / totalSum) * 100).toFixed(1);
            
            // Визуальная ширина полоски относительно лидера (для графики)
            // Самый популярный всегда 100%, остальные меньше
            const visualWidth = ((item.count / maxCount) * 100).toFixed(1);
            
            const color = COLORS[item.name] || '#d4a137';
            
            const div = document.createElement('div');
            div.className = 'stat-row';
            div.innerHTML = `
                <img src="${ICONS[item.name]}" class="icon-circle" alt="${item.name}">
                <div class="progress-container">
                    <div class="progress-bar" style="width: ${visualWidth}%; background: ${color};"></div>
                    <div class="label-text">
                        <span>${item.name}</span>
                        <span>${realPerc}%</span>
                    </div>
                </div>
            `;
            container.appendChild(div);
        });
    }
</script>
</body>
</html>
